<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#091220" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Urban Grid Lines -->
  <line x1="128" y1="96" x2="128" y2="416" stroke="#1e3a5d" stroke-width="6" stroke-dasharray="12 12" />
  <line x1="256" y1="96" x2="256" y2="416" stroke="#1e3a5d" stroke-width="8" />
  <line x1="384" y1="96" x2="384" y2="416" stroke="#1e3a5d" stroke-width="6" stroke-dasharray="12 12" />

  <line x1="96" y1="170" x2="416" y2="170" stroke="#1e3a5d" stroke-width="6" stroke-dasharray="12 12" />
  <line x1="96" y1="280" x2="416" y2="280" stroke="#1e3a5d" stroke-width="8" />
  <line x1="96" y1="390" x2="416" y2="390" stroke="#1e3a5d" stroke-width="6" stroke-dasharray="12 12" />

  <!-- Dynamic SUTRA 'S' & Alliance Triangle -->
  <path d="M 256 120 L 370 340 L 142 340 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linejoin="round" />

  <!-- Central Nexus Node -->
  <circle cx="256" cy="235" r="44" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="10" />
  <circle cx="256" cy="235" r="22" fill="url(#emeraldGrad)" />

  <!-- Connected Coordination Nodes -->
  <circle cx="256" cy="120" r="24" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="370" cy="340" r="24" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="142" cy="340" r="24" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="4" />

  <!-- Text Label -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="10">SUTRA</text>
</svg>
